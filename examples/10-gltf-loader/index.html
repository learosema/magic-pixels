<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>glTF loader &mdash; magic-pixels example</title>
    <link rel="stylesheet" href="../style.css" />
    <style>
      #canvas {
        touch-action: none;
      }
      .controls {
        pointer-events: auto;
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem 1rem;
        align-items: center;
        margin-top: 0.75rem;
        font-size: 0.85rem;
      }
      .controls select {
        font: inherit;
        padding: 0.25rem 0.5rem;
        background: #1c1f28;
        color: inherit;
        border: 1px solid #2a2d38;
        border-radius: 0.25rem;
      }
      #status {
        font-size: 0.85rem;
        opacity: 0.8;
        margin-top: 0.5rem;
      }
      body.dragging::after {
        content: 'Drop a .glb, or a .gltf with its .bin and images';
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: rgba(17, 19, 24, 0.7);
        border: 2px dashed #9ecbff;
        font-size: 1.25rem;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <div class="overlay">
      <div>
        <h1>glTF loader</h1>
        <p>
          <code>loadGltf(url)</code> turns a glTF file into a scene. Drag to
          turn it, or drop your own <code>.glb</code> (or
          <code>.gltf</code> with its <code>.bin</code> and images).
        </p>
        <div class="controls">
          <label
            >Model
            <select id="model"></select
          ></label>
          <label
            ><input type="checkbox" id="lights" checked /> demo lights</label
          >
        </div>
        <div id="status">Loading&hellip;</div>
      </div>
      <a href="../">&larr; all examples</a>
    </div>
    <!--
      Neither decoder is bundled with magic-pixels: both are options the
      loader accepts, never a dependency. Draco decoding runs in a pool of
      workers (`options.draco = { decoderPath }`); each worker fetches and
      `importScripts()`s the classic (non-module) decoder script itself the
      first time it is asked to decode. meshopt's decoder is a real ES
      module, imported lazily on the main thread below. Most sample models
      need neither, so this hint just warms the HTTP cache in idle time so
      first use doesn't pay the fetch latency.
    -->
    <link
      rel="prefetch"
      as="script"
      href="https://www.gstatic.com/draco/versioned/decoders/1.5.7/draco_decoder.js"
    />
    <link
      rel="modulepreload"
      href="https://cdn.jsdelivr.net/npm/meshoptimizer@1.2.0/meshopt_decoder.mjs"
    />
    <script type="module" src="./script.js"></script>
  </body>
</html>
