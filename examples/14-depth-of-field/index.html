<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Depth of field &mdash; magic-pixels example</title>
    <link rel="stylesheet" href="../style.css" />
    <style>
      .overlay > div,
      .overlay > a {
        background: rgba(17, 19, 24, 0.6);
        padding: 0.5rem 0.75rem;
        border-radius: 0.5rem;
      }
      .controls {
        pointer-events: auto;
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem 1rem;
        align-items: center;
        margin-top: 0.75rem;
        font-size: 0.85rem;
      }
      .controls input[type='range'] {
        vertical-align: middle;
      }
      #status {
        font-size: 0.85rem;
        opacity: 0.8;
        margin-top: 0.5rem;
      }
    </style>
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <div class="overlay">
      <div>
        <h1>Depth of field</h1>
        <p>
          A float <code>RenderTarget</code> with <code>depth: 'texture'</code>,
          then a pass that blurs each pixel by how far its depth is from the
          focus plane. The lights are far brighter than 1, so out of focus they
          spread into bokeh discs.
        </p>
        <div class="controls">
          <label>
            <input id="auto" type="checkbox" checked /> rack focus
          </label>
          <label>
            Focus
            <input
              id="focus"
              type="range"
              min="2"
              max="60"
              step="0.1"
              value="6"
            />
            <output id="focus-value">6.0</output>
          </label>
          <label>
            Aperture
            <input
              id="aperture"
              type="range"
              min="0"
              max="30"
              step="1"
              value="12"
            />
            <output id="aperture-value">12</output>
          </label>
        </div>
        <div id="status"></div>
      </div>
      <a href="../">&larr; all examples</a>
    </div>
    <script type="module" src="./script.js"></script>
  </body>
</html>
