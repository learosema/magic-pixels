<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13">
  <title>A unit quaternion is an axis and an angle: (x, y, z) is the axis scaled by sin(θ/2), w is cos(θ/2)</title>
  <defs>
    <marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2937"/>
    </marker>
    <marker id="arrow-axis" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c2410c"/>
    </marker>
    <marker id="arrow-angle" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8"/>
    </marker>
  </defs>

  <!-- figure background, so the drawing reads the same in a light and a dark page theme -->
  <rect x="0.5" y="0.5" width="759" height="339" rx="8" fill="#ffffff" stroke="#d1d5db"/>

  <!-- ===== left panel: the rotation as axis + angle ===== -->
  <g fill="#1f2937">
    <text x="20" y="28" font-weight="600">One turn around one axis</text>
  </g>
  <!-- the rotation axis a (unit vector from the origin) -->
  <circle cx="110" cy="250" r="3" fill="#1f2937"/>
  <text x="96" y="272" fill="#1f2937">origin</text>
  <line x1="110" y1="250" x2="176" y2="63" stroke="#c2410c" stroke-width="2.5" marker-end="url(#arrow-axis)"/>
  <text x="184" y="60" fill="#c2410c" font-weight="600">a</text>
  <text x="196" y="60" fill="#c2410c" font-size="11">(unit axis)</text>

  <!-- the circle a point travels on, perpendicular to the axis -->
  <g transform="translate(146 148) rotate(19.4)">
    <ellipse rx="58" ry="19" fill="none" stroke="#9ca3af" stroke-dasharray="4 3"/>
    <!-- the turn itself: from p to p', counter-clockwise when looking down the axis -->
    <path d="M -57.1 3.3 A 58 19 0 0 0 57.1 3.3" fill="none" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#arrow-angle)"/>
    <line x1="0" y1="0" x2="-57.1" y2="3.3" stroke="#9ca3af"/>
    <line x1="0" y1="0" x2="57.1" y2="3.3" stroke="#9ca3af"/>
    <circle cx="-57.1" cy="3.3" r="3.5" fill="#1f2937"/>
    <circle cx="57.1" cy="3.3" r="3.5" fill="#1f2937"/>
  </g>
  <text x="60" y="168" fill="#1f2937">p</text>
  <text x="212" y="168" fill="#1f2937">p′</text>
  <text x="139" y="196" fill="#1d4ed8" font-weight="600" font-size="15">θ</text>
  <text x="20" y="312" fill="#4b5563" font-size="12">Every rotation is one angle θ around</text>
  <text x="20" y="328" fill="#4b5563" font-size="12">one axis a, however it was built.</text>

  <!-- divider -->
  <line x1="262" y1="16" x2="262" y2="324" stroke="#e5e7eb"/>

  <!-- ===== right panel, top: the four numbers ===== -->
  <text x="290" y="28" fill="#1f2937" font-weight="600">…packed into four numbers</text>

  <!-- slot labels -->
  <g fill="#6b7280" font-size="12" text-anchor="middle">
    <text x="340" y="52">x</text>
    <text x="446" y="52">y</text>
    <text x="552" y="52">z</text>
    <text x="668" y="52">w</text>
  </g>
  <!-- slots -->
  <g stroke-width="1.5">
    <rect x="290" y="58" width="100" height="40" rx="5" fill="#fff7ed" stroke="#c2410c"/>
    <rect x="396" y="58" width="100" height="40" rx="5" fill="#fff7ed" stroke="#c2410c"/>
    <rect x="502" y="58" width="100" height="40" rx="5" fill="#fff7ed" stroke="#c2410c"/>
    <rect x="618" y="58" width="100" height="40" rx="5" fill="#eff6ff" stroke="#1d4ed8"/>
  </g>
  <g text-anchor="middle" font-size="13">
    <text x="340" y="83" fill="#c2410c">a.x · sin(θ/2)</text>
    <text x="446" y="83" fill="#c2410c">a.y · sin(θ/2)</text>
    <text x="552" y="83" fill="#c2410c">a.z · sin(θ/2)</text>
    <text x="668" y="83" fill="#1d4ed8">cos(θ/2)</text>
  </g>
  <!-- braces (as brackets) under the two groups -->
  <path d="M 292 108 v 8 h 308 v -8" fill="none" stroke="#c2410c" stroke-width="1.5"/>
  <path d="M 620 108 v 8 h 96 v -8" fill="none" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="446" y="134" fill="#c2410c" font-size="12" text-anchor="middle">the axis a, scaled by sin(θ/2)</text>
  <text x="668" y="134" fill="#1d4ed8" font-size="12" text-anchor="middle">cos(θ/2)</text>

  <!-- worked example -->
  <text x="290" y="168" fill="#1f2937" font-size="12">Example: a quarter turn (θ = 90°) around Z, so a = (0, 0, 1) and θ/2 = 45°:</text>
  <g text-anchor="middle" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <rect x="290" y="178" width="100" height="30" rx="5" fill="#f9fafb" stroke="#d1d5db"/>
    <rect x="396" y="178" width="100" height="30" rx="5" fill="#f9fafb" stroke="#d1d5db"/>
    <rect x="502" y="178" width="100" height="30" rx="5" fill="#f9fafb" stroke="#d1d5db"/>
    <rect x="618" y="178" width="100" height="30" rx="5" fill="#f9fafb" stroke="#d1d5db"/>
    <text x="340" y="198" fill="#1f2937">0</text>
    <text x="446" y="198" fill="#1f2937">0</text>
    <text x="552" y="198" fill="#c2410c">0.707</text>
    <text x="668" y="198" fill="#1d4ed8">0.707</text>
  </g>

  <!-- ===== right panel, bottom: why the length is always 1 ===== -->
  <line x1="290" y1="224" x2="718" y2="224" stroke="#e5e7eb"/>
  <!-- unit circle with the half angle -->
  <g transform="translate(345 288)">
    <circle r="46" fill="none" stroke="#9ca3af" stroke-dasharray="4 3"/>
    <line x1="-52" y1="0" x2="52" y2="0" stroke="#e5e7eb"/>
    <line x1="0" y1="-52" x2="0" y2="52" stroke="#e5e7eb"/>
    <!-- radius at angle θ/2 = 45° -->
    <line x1="0" y1="0" x2="32.5" y2="-32.5" stroke="#1f2937" stroke-width="1.5"/>
    <circle cx="32.5" cy="-32.5" r="3" fill="#1f2937"/>
    <!-- the two legs -->
    <line x1="0" y1="0" x2="32.5" y2="0" stroke="#1d4ed8" stroke-width="3"/>
    <line x1="32.5" y1="0" x2="32.5" y2="-32.5" stroke="#c2410c" stroke-width="3"/>
    <!-- the half angle -->
    <path d="M 12 0 A 12 12 0 0 0 8.5 -8.5" fill="none" stroke="#1d4ed8" stroke-width="1.5"/>
    <text x="13" y="-3" fill="#1d4ed8" font-size="10">θ/2</text>
  </g>
  <text x="410" y="258" fill="#1f2937" font-weight="600" font-size="12">Why the length is always 1</text>
  <text x="410" y="277" fill="#1d4ed8" font-size="12">w = cos(θ/2)</text>
  <text x="410" y="294" fill="#c2410c" font-size="12">|(x, y, z)| = sin(θ/2), because a has length 1</text>
  <text x="410" y="314" fill="#4b5563" font-size="12">cos² + sin² = 1, so x² + y² + z² + w² = 1: a unit</text>
  <text x="410" y="330" fill="#4b5563" font-size="12">quaternion, a point on a four-dimensional sphere.</text>
</svg>
